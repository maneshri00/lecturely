version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lecturely-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lecturelydb}
      POSTGRES_USER: ${POSTGRES_USER:-lecturelyuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-LecturelySecurePass2026!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lecturelyuser} -d ${POSTGRES_DB:-lecturelydb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lecturely-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lecturely-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lecturelydb}
      DATABASE_USERNAME: ${POSTGRES_USER:-lecturelyuser}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-LecturelySecurePass2026!}
      JWT_SECRET: ${JWT_SECRET:-lecturely-india-super-secret-jwt-key-minimum-256-bits-for-hs256-production}
      SPRING_MAIL_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - lecturely-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lecturely-frontend-prod
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - lecturely-network

volumes:
  postgres_data:
    driver: local

networks:
  lecturely-network:
    name: lecturely-production-network
    driver: bridge
