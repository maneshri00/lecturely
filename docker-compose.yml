version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lectureconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lectureconnect
      POSTGRES_USER: lectureconnect
      POSTGRES_PASSWORD: lectureconnect123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lectureconnect -d lectureconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lectureconnect-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/lectureconnect
      DATABASE_USERNAME: lectureconnect
      DATABASE_PASSWORD: lectureconnect123
      JWT_SECRET: lectureconnect-india-super-secret-jwt-key-2024-minimum-256-bits-for-hs256
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lectureconnect-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://backend:8080/api
    ports:
      - "3000:80"

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: lectureconnect-network
