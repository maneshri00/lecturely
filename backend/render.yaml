services:
  - type: web
    name: lecturely-backend
    env: docker
    dockerfilePath: Dockerfile
    context: .
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.netlify.app,https://*.netlify.com"
